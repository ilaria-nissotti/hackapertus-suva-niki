[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "suva-bger"
version = "0.1.0"
description = "Triage and DE/FR summaries of Swiss Federal Supreme Court judgements for Suva, powered by Apertus"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["openai>=1.40", "python-dotenv>=1.0", "beautifulsoup4>=4.12", "lxml>=5.0", "pandas>=2.2", "openpyxl>=3.1"]

[project.scripts]
suva = "suva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
