# Relevance rules for Federal Supreme Court judgements (Suva)
# ==========================================================
#
# This file decides which judgements are relevant. Edit it freely; no code changes needed.
#
# How scoring works
#   rule points = the weights of every rule that matches (negative weights subtract)
#   score       = base + rule points          (display only)
#
#   Judgements are ranked by their rule points: more points, higher on the list. Rule points are
#   not a probability; only the order matters. Lawyers then see the top N per month (see `selection`).
#   Ranking, the selection floor and the judge gate all use rule points; base is never involved.
#   The explanations of the matching rules are shown to lawyers as the reason for the rank.
#
# Writing a rule
#   id:           short unique name (letters, digits, underscores)
#   description:  what the rule means, in plain words
#   field:        where to look in the judgement:
#                   parties         the parties (Verfahrensbeteiligte / Participants à la procédure)
#                   appellant       the party that appealed (before "gegen / contre / contro"), without its lawyer
#                   subject         the one-line subject (Gegenstand / Objet / Oggetto)
#                   header          everything before the facts
#                   regeste         the headnote of a leading decision (BGE / ATF / DTF), empty otherwise
#                   facts           the facts (Sachverhalt / Faits / Fatti)
#                   considerations  the court's reasoning (Erwägungen / Considérants)
#                   dispositiv      the ruling (Demnach erkennt das Bundesgericht / Par ces motifs)
#                   text            the whole judgement
#                   laws            laws cited, German abbreviation: UVG, UVV, ATSG, IVG, KVG, BVG ...
#                                   (LAA, LAINF, LPGA ... are already translated to these)
#                   articles        articles cited, e.g. "Art. 6 Abs. 2 UVG"
#                   bge             leading decisions cited, e.g. "BGE 134 V 109"
#                   chamber         court division prefix: 8C, 9C, 4A ...
#                   language        de, fr, it
#                   outcome         how the court ruled: upheld, partly_upheld, dismissed, not_entered,
#                                   written_off, sent_back (several possible)
#                   reasoning_pages length of the court's reasoning in pages (about 3,000 characters each)
#   match:        any: [...]   fires if at least one term is found
#                 all: [...]   fires only if every term is found
#                 regex: "..." for advanced patterns
#                 none: [...]  does not fire if any of these is found (combine with any/all/regex)
#                 min: N       number fields only: fires from N on
#                 Text is matched as whole words, ignoring upper/lower case.
#                 List terms in German, French AND Italian: judgements exist in one language only.
#   case_sensitive: true       optional, e.g. for short abbreviations like "CNA"
#   weight:       points added when the rule fires (negative to subtract)
#     or, for a graded rule that counts matches instead of just yes/no:
#   per_match:    points per match (e.g. per UVG article cited)
#   max:          cap on the points of a graded rule (optional)
#   explanation:  sentence shown to lawyers when the rule fires
#   group:        topic (what the case is about, default) | significance (whether it matters)
#   source:       where the rule comes from: expert | data | apertus | hypothesis
#   evidence:     filled in from `python -m suva evaluate` (how often it fires in relevant vs not relevant)
#
# Workflow
#   python -m suva analyze        find candidate rules in the training data
#   python -m suva evaluate       check the reading list: recall and precision of the top N, misses, false alarms
#   python -m suva cv             the same on judgements the weights were not fitted on (cross-validation)
#   python -m suva fit-weights    suggest weights and a floor from the data (written to rules.fitted.yaml)

# base and weights: fitted on the training data (decisions 2025-10-01 to 2026-02-28)
# with `python -m suva fit-weights`, then copied here. Adjust freely.
base: -95         # display only: the score shown to lawyers is base + rule points. Not used to rank,
                  # select or decide which judgements the judge sees

# What lawyers see: the top_n judgements of each period, most rule points first.
#   floor_rule_points only shortens a period's list: in a quiet month, judgements below the floor are
#   left out instead of filling all top_n places. It never adds judgements.
#   Rule points depend on the weights: when the weights change, take the new floor from `fit-weights`.
selection:
  top_n: 30               # judgements shown per period. Training picks found: 87% (`cv`, refit),
                          # 93% with these weights (`evaluate`, equal points in random order)
  floor_rule_points: 66   # in rule points, without base (= the former -29 points with base -95).
                          # No relevant training judgement has fewer than 73 rule points (`evaluate` scores CSV)
  per: month              # month | week | period (the whole input as one list)

rules:
  - id: suva_party
    description: Suva is a party to the proceedings
    field: parties
    match:
      any:
        - Suva
        - Schweizerische Unfallversicherungsanstalt
        - Caisse nationale suisse d'assurance en cas d'accidents
        - Istituto nazionale svizzero di assicurazione contro gli infortuni
        - CNA
        - INSAI
    weight: 6
    explanation: "Suva is directly involved as a party."
    source: hypothesis
    evidence: ""

  - id: accident_insurance_subject
    description: The subject is accident insurance
    field: subject
    match:
      any:
        - Unfallversicherung
        - assurance-accidents
        - assurance accidents
        - assicurazione contro gli infortuni
        - assicurazione infortuni
    weight: 51
    explanation: "The case is about accident insurance."
    source: hypothesis
    evidence: ""

  - id: cites_accident_insurance_law
    description: Cites articles of the Accident Insurance Act or Ordinance (UVG/UVV, also LAA/OLAA, LAINF/OAINF); more articles, more points
    field: articles
    match:
      regex: " (UVG|UVV)$"
    case_sensitive: true
    per_match: 6
    max: 30
    explanation: "Applies accident insurance law (UVG/UVV articles cited)."
    source: hypothesis
    evidence: ""

  - id: invalidity_insurance_subject
    description: The subject is invalidity insurance (Suva also summarises these)
    field: subject
    match:
      any:
        - Invalidenversicherung
        - assurance-invalidité
        - assurance invalidité
        - assicurazione per l'invalidità
        - assicurazione invalidità
    weight: 41
    explanation: "The case is about invalidity insurance."
    source: data
    evidence: "train: fires in 13/47 relevant, 151/3162 not relevant (evaluate)"

  - id: social_insurance_chamber
    description: Decided by a social insurance division (8C or 9C)
    field: chamber
    match:
      any: [8C, 9C]
    weight: 32
    explanation: "Decided by a social insurance division of the court."
    source: hypothesis
    evidence: ""

  - id: health_insurance_subject
    description: The subject is health insurance
    field: subject
    match:
      any: [Krankenversicherung, assurance-maladie, assurance maladie, assicurazione malattie]
    weight: -5
    explanation: "Health insurance case, outside accident insurance."
    source: hypothesis
    evidence: ""

  - id: other_branch_subject
    description: The subject is unemployment insurance or occupational pensions
    field: subject
    match:
      any:
        - Arbeitslosenversicherung
        - berufliche Vorsorge
        - assurance-chômage
        - prévoyance professionnelle
        - assicurazione contro la disoccupazione
        - previdenza professionale
    weight: -9
    explanation: "Unemployment insurance or occupational pensions, outside accident insurance."
    source: hypothesis
    evidence: ""

  - id: not_entered
    description: The court did not enter into the appeal (inadmissible)
    field: dispositiv
    match:
      any: [nicht eingetreten, irrecevable, inammissibile]
    weight: -43
    explanation: "Appeal declared inadmissible: no ruling on the substance."
    source: hypothesis
    evidence: ""

# --- Significance: whether a case matters, not just what it is about ------------------------
# The topic rules cannot tell a routine accident-insurance case from one Suva summarises.
# These rules look at who appealed, how the court ruled and how much reasoning it needed.
# Weights start at 0 (measured, not scored): `fit-weights` suggests them, `compare` shows the gain.

  - id: insurer_appeals
    group: significance
    description: An accident insurer (Suva or another) brought the appeal
    field: appellant
    match:
      any: [Suva, Schweizerische Unfallversicherungsanstalt, Caisse nationale suisse d'assurance en cas d'accidents,
            CNA, INSAI, Versicherung, Versicherungen, Versicherungs, Assurance, Assurances, assicurazione,
            assicurazioni, Allianz, AXA, Helvetia, Mobiliar, Generali, Baloise, Bâloise, Vaudoise, Zurich, Visana,
            SWICA, Helsana, CSS, Sanitas, Concordia, Solida, Groupe Mutuel, Elips, HOTELA, Sympany]
      none: [IV-Stelle, assurance-invalidité, assicurazione invalidità, Ufficio AI, IVSTA, Ausgleichskasse,
             caisse de compensation, cassa di compensazione, Arbeitslosenkasse, caisse de chômage, Vorsorge,
             prévoyance, previdenza, Pensionskasse, caisse de pensions]
    weight: 0
    explanation: "The insurer appealed: the legal question likely matters beyond this case."
    source: data
    evidence: "train, accident/invalidity cases: 14/47 relevant vs 3/182 not relevant (docs/pitch_stats.py)"

  - id: appeal_upheld
    group: significance
    description: The court upheld the appeal, fully or in part (the lower court got something wrong)
    field: outcome
    match:
      any: [upheld, partly_upheld]
    weight: 0
    explanation: "The appeal was upheld: the court corrected the lower court."
    source: data
    evidence: "train, accident/invalidity cases: 17/47 relevant vs 25/182 not relevant (docs/pitch_stats.py)"

  - id: clarifies_case_law
    group: significance
    description: The court changes or clarifies its case law (DE, FR, IT wording)
    field: considerations
    match:
      regex: "Praxisänderung|Änderung der Rechtsprechung|Präzisierung der Rechtsprechung|Rechtsprechung (zu )?präzisieren|changement de jurisprudence|précis(er|e|ion de) (la|sa|notre) jurisprudence|cambiamento di giurisprudenza|precisa(re|zione della)? (la )?(sua )?giurisprudenza"
    weight: 0
    explanation: "The court changes or clarifies its case law."
    source: hypothesis
    evidence: ""

  - id: long_reasoning
    group: significance
    description: The court's reasoning runs to 4 pages or more (routine cases are short)
    field: reasoning_pages
    match:
      min: 4
    weight: 0
    explanation: "Detailed reasoning (4+ pages)."
    source: data
    evidence: "train, accident/invalidity cases: 32/47 relevant vs 64/182 not relevant (docs/pitch_stats.py)"

# LLM judge (second stage, optional): Apertus rates candidates and gives a written reason.
#   candidate_floor_rule_points: only judgements with at least this many rule points (no base) are sent
#                           to the judge. 66 = the former -29 points with base -95, so the judge sees the
#                           same candidates; like the selection floor, it depends on the weights
#   model: leave empty to use LLM_NAME from .env
#   points: added to the rule points when a verdict exists (`evaluate --with-judge`)
#   rubric: what Suva considers relevant, in plain words; the judge follows it
judge:
  candidate_floor_rule_points: 66
  model:
  points:
    high: 10
    medium: 0
    low: -20
  rubric: |
    Suva is the largest Swiss accident insurer. Its lawyers summarise Federal Supreme Court
    judgements that matter for their daily work in accident insurance (UVG/LAA): new or clarified
    case law on the notion of accident, natural and adequate causal link, benefits, integrity
    compensation, disability pensions, insurance obligation and premiums, recourse, or procedural
    questions under ATSG that affect accident insurers.
    Judgements that only concern other insurance branches (health, unemployment, occupational
    pensions), or that are dismissed on purely formal grounds without a statement of legal
    interest, are usually not relevant.
