# Suva terminology: German / French term pairs for summaries
# ==========================================================
#
# Each pair is the term Suva uses in a German summary and the one it uses in a French
# summary. Edit freely; no code changes needed.
#
#   de / fr   the term in each language. All-capital abbreviations (UVG, LAA) match
#             case-sensitively; other terms match ignoring case. Terms match whole words.
#   flag      false = only suggest the pair to the model, never warn about it
#             (use it for terms that are also ordinary words in the other language).
#
# How it is used
#   1. Drafting: pairs whose German or French term occurs in the judgement or the factual
#      brief are passed to Apertus with the instruction to use the target-language term.
#   2. Review: a draft that contains the other language's term (e.g. "LAA" in a German
#      summary) gets a glossary warning in the review workspace. It is a hint, not a rejection.
#
# Many pairs below occur in the supplied DE/FR exports (judgements/Export_*.html).

version: 1
